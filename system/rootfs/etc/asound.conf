# MIROKI ALSA configuration
#
# The sprdphone-sc2730 has no usable hardware volume control (the HP "Gain"
# controls are attenuators and ROCKNIX does volume in pipewire instead), so
# volume is a softvol plugin: it creates the "MIMIKI Playback Volume" user
# control on card 0, which mimiki-inputd drives via amixer.
#
# The AGDSP/VBC path runs at 48kHz MONO (single speaker, VBC_MIXER0_DAC0
# HALF_ADD downmix); the plug layers pin the slave to 48k/1ch so stereo
# 44.1kHz emulator output is downmixed+resampled instead of coming out an
# octave deep (stereo frames read as mono = half speed).

pcm.!default {
    type plug
    slave.pcm "mimiki_softvol"
}

pcm.mimiki_softvol {
    type softvol
    slave.pcm "mimiki_hw48"
    control {
        name "MIMIKI Playback Volume"
        card 0
    }
    min_dB -45.0
    max_dB 0.0
    resolution 16
}

pcm.mimiki_hw48 {
    type plug
    slave {
        pcm "hw:0,0"
        rate 48000
        format S16_LE
        channels 1
    }
}

ctl.!default {
    type hw
    card 0
}
